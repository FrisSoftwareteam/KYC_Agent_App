# Builds the CléCheck agent app for Android on GitHub's servers.
# Run it from the repo's Actions tab: "Build Android app" > Run workflow (choose the branch).
# Download the result from the run's Artifacts section:
#   - clecheck-agent-<version>.apk : install on a test phone
#   - clecheck-agent-<version>.aab : upload to Google Play (only if the company release key is set)
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ABLY_KEY             required: the SUBSCRIBE-ONLY Ably key (starts 70A3og.)
#   AGENT_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#                        optional: the company release key, for a Play Store build. Without
#                        them the app is signed with the test key: fine for test phones only.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API address the app talks to (keep the slash at the end)
        default: https://firstcheckapi.firstregistrarsnigeria.com/v1/
        required: true
      distance:
        description: Metres an agent must be within to submit a visit
        default: '100'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Write app settings (.env)
        env:
          ABLY_KEY: ${{ secrets.ABLY_KEY }}
          API_URL: ${{ inputs.api_url }}
          DISTANCE: ${{ inputs.distance }}
        run: |
          if [ -z "$ABLY_KEY" ]; then echo "::error::Add the ABLY_KEY repository secret first (Settings > Secrets and variables > Actions)."; exit 1; fi
          case "$API_URL" in https://*/) ;; *) echo "::error::api_url must start with https:// and end with /"; exit 1;; esac
          printf 'API_URL=%s\nABLY_KEY=%s\nDISTANCE=%s\n' "$API_URL" "$ABLY_KEY" "$DISTANCE" > .env

      - name: Company release key (if set)
        env:
          KEYSTORE_B64: ${{ secrets.AGENT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/agentApp.keystore; echo "Signing with the company release key."; else echo "::warning::No release key set: signed with the test key (test phones only, not the Play Store)."; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Name the files
        id: name
        run: |
          v=$(grep -m1 'versionName' android/app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          c=$(grep -m1 'versionCode' android/app/build.gradle | grep -oE '[0-9]+')
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/clecheck-agent-$v-$c.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/clecheck-agent-$v-$c.aab"
          echo "version=$v-$c" >> "$GITHUB_OUTPUT"
          rm -f .env android/app/agentApp.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: clecheck-agent-${{ steps.name.outputs.version }}
          path: out/
          retention-days: 30
